<!doctype html>
<html>
  <head> </head>
  <body>
    <form name="myForm" id="myForm" method="post">
      First Name: <input type="text" id="fname" name="fname" /><br />
      Last Name: <input type="text" id="lname" name="lname" /><br />
      Email: <input type="text" id="mail" name="mail" /><br />
      Phone Number: <input type="text" id="phnum" name="phnum" /><br />
      <input type="submit" value="Submit" />
    </form>

    <script>
      document
        .getElementById("myForm")
        .addEventListener("submit", function (event) {
          var fname = document.getElementById("fname").value;
          var lname = document.getElementById("lname").value;
          var email = document.getElementById("mail").value;
          var number = document.getElementById("phnum").value;
          if (fname == "" || lname == "") {
            alert("Name must be filled out");
            event.preventDefault();
          }
          if (!email.includes("@") || !email.includes(".com")) {
            alert("Email must contain @ and .com");
            event.preventDefault();
          }
          if (number.length != 11) {
            alert("Phone number must contain 11 digits");
            event.preventDefault();
          }
        });
    </script>
  </body>
</html>
